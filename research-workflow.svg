<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="t d"><title id="t">Quant research pipeline</title><desc id="d">A research workflow from data validation through parameter scans, train test validation, execution stress checks, and documented findings.</desc><rect width="920" height="360" rx="20" fill="#e8eee2"/><text x="44" y="52" fill="#586b52" font-family="monospace" font-size="13" letter-spacing="2">RESEARCH SYSTEM / PYTHON + AI ASSISTED ANALYSIS</text><text x="44" y="96" fill="#17211b" font-family="Arial,sans-serif" font-size="29" font-weight="700">A repeatable path from raw data to honest findings</text><g font-family="Arial,sans-serif"><g><rect x="44" y="148" width="150" height="126" rx="12" fill="#fff"/><text x="62" y="181" fill="#75964b" font-family="monospace" font-size="11">01 / DATA</text><text x="62" y="213" fill="#17211b" font-size="16" font-weight="700">Validate</text><text x="62" y="238" fill="#68746a" font-size="12">bars · gaps · time</text></g><g><rect x="222" y="148" width="150" height="126" rx="12" fill="#fff"/><text x="240" y="181" fill="#75964b" font-family="monospace" font-size="11">02 / SEARCH</text><text x="240" y="213" fill="#17211b" font-size="16" font-weight="700">Scan rules</text><text x="240" y="238" fill="#68746a" font-size="12">parameters · assets</text></g><g><rect x="400" y="148" width="150" height="126" rx="12" fill="#fff"/><text x="418" y="181" fill="#75964b" font-family="monospace" font-size="11">03 / VALIDATE</text><text x="418" y="213" fill="#17211b" font-size="16" font-weight="700">Walk forward</text><text x="418" y="238" fill="#68746a" font-size="12">train → test</text></g><g><rect x="578" y="148" width="150" height="126" rx="12" fill="#fff"/><text x="596" y="181" fill="#75964b" font-family="monospace" font-size="11">04 / STRESS</text><text x="596" y="213" fill="#17211b" font-size="16" font-weight="700">Model fills</text><text x="596" y="238" fill="#68746a" font-size="12">spread · slippage</text></g><g><rect x="756" y="148" width="120" height="126" rx="12" fill="#152018"/><text x="773" y="181" fill="#b9ef72" font-family="monospace" font-size="11">05 / REPORT</text><text x="773" y="213" fill="#f4f6ef" font-size="16" font-weight="700">Explain</text><text x="773" y="238" fill="#b4c0b0" font-size="12">limits included</text></g></g><g stroke="#8da678" stroke-width="2" fill="none"><path d="M196 211h20m0 0-6-6m6 6-6 6M374 211h20m0 0-6-6m6 6-6 6M552 211h20m0 0-6-6m6 6-6 6M730 211h20m0 0-6-6m6 6-6 6"/></g><text x="44" y="322" fill="#6d796c" font-family="Arial,sans-serif" font-size="12">Python scripts + AI-assisted coding/research workflows · Human review of assumptions and results</text></svg>
