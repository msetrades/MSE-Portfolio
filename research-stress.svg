<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc"><title id="title">Exit stop sensitivity in a Boom 1000 research scan</title><desc id="desc">For one archived breakout L120 configuration, average R was 7.335 in the base result, 6.127 under a 6R stop variant, and 5.161 under a 10R stop variant.</desc><rect width="1040" height="510" rx="20" fill="#111913"/><text x="44" y="52" fill="#bdcbb8" font-family="monospace" font-size="12" letter-spacing="2">SENSITIVITY SCAN / EXIT MODEL</text><text x="44" y="94" fill="#f3f6ef" font-family="Arial,sans-serif" font-size="28" font-weight="700">How the exit assumption changes the result</text><text x="44" y="122" fill="#96a293" font-family="Arial,sans-serif" font-size="13">Boom 1000 · breakout L120 short-only · 0.5 ATR stop · 1:10 target · 1,213 trades</text><g stroke="#304033"><path d="M300 180v250M445 180v250M590 180v250M735 180v250M880 180v250"/></g><g fill="#899787" font-family="monospace" font-size="11"><text x="294" y="456">0R</text><text x="437" y="456">2R</text><text x="582" y="456">4R</text><text x="727" y="456">6R</text><text x="872" y="456">8R</text></g><g fill="#e4ebe0" font-family="Arial,sans-serif" font-size="14"><text x="52" y="235">Base scan average</text><text x="52" y="319">6R stop variant</text><text x="52" y="403">10R stop variant</text></g><g><rect x="300" y="207" width="532" height="42" rx="7" fill="#b9ef72"/><rect x="300" y="291" width="444" height="42" rx="7" fill="#8ec85b"/><rect x="300" y="375" width="374" height="42" rx="7" fill="#638d47"/></g><g fill="#162019" font-family="monospace" font-size="14" font-weight="700"><text x="845" y="234">7.335 R</text><text x="757" y="318">6.127 R</text><text x="687" y="402">5.161 R</text></g><text x="44" y="484" fill="#758374" font-family="Arial,sans-serif" font-size="11">Source: boom_1to10_slippage_stress.csv and boom_1to10_scan_results.csv. Simulation assumptions; not a forecast.</text></svg>
