<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Out-of-sample research results</title>
  <desc id="desc">Average R per trade in train and test samples for three selected Boom 1000 candidate configurations. Values are close: 0.773 and 0.767, 0.768 and 0.766, 0.768 and 0.766.</desc>
