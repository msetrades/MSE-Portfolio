  <text x="48" y="111" fill="#91a08e" font-family="Arial,sans-serif" font-size="14">Average R per trade · Boom 1000 · short sample, hypothesis generation only</text>

  <g fill="#b9c4b4" font-family="monospace" font-size="11" text-anchor="middle">
