    <rect x="233" y="171" width="44" height="184" rx="5" fill="#70a746"/>
    <rect x="416" y="171" width="44" height="184" rx="5" fill="#b9ef72"/>
    <rect x="468" y="171" width="44" height="184" rx="5" fill="#70a746"/>
