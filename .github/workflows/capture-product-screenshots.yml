name: Capture deployed product screens

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/capture-product-screenshots.yml"
      - "scripts/capture-product-screenshots.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-screenshot-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture deployed interfaces
        run: node scripts/capture-product-screenshots.mjs
      - name: Publish screenshots to the portfolio repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/mse-suite/
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture deployed MSE product screens"
            git push origin HEAD:master
          fi
